name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the AArch64 toolchain
        # Lets the ARM64 backend tests do more than assemble: they cross-compile
        # the emitted code and run it under qemu, comparing every lane against
        # the portable backend.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user llvm

      - name: Install
        run: pip install -e '.[numpy]' pyflakes

      - name: Lint
        run: python -m pyflakes qubitbridge tests examples benchmarks

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Examples
        run: |
          python examples/hello_apqb.py
          python examples/qbnn_layer.py

      - name: Benchmarks
        # Just confirms they still run and print a table on a shared CI
        # runner; tests/test_benchmarks.py already checks their numerics.
        # No --big: the 1,000,000-lane row is for a real measurement, not CI.
        run: |
          python benchmarks/qbnn_layer_bench.py
          python benchmarks/lean_kernel_bench.py

  stdlib-only:
    # The toolchain must work with nothing but the standard library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -t . -q
      - run: python examples/hello_apqb.py
