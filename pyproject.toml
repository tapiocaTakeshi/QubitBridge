[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qubitbridge"
version = "0.1.0"
description = "Qubit Virtual Machine: run APQB (adjustable pseudo qubit) computation on ordinary CPUs, GPUs and NPUs"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["apqb", "qbnn", "quantum-inspired", "compiler", "virtual-machine",
            "aarch64", "neon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.22"]

[project.scripts]
qvm = "qubitbridge.cli:main"

[tool.setuptools]
packages = ["qubitbridge", "qubitbridge.backends"]

[tool.setuptools.package-data]
qubitbridge = ["py.typed"]
